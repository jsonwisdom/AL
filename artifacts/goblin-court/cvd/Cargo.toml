[package]
name = "goblin-court-cvd"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Design-stage Goblin Court continuous verification daemon state machine"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
