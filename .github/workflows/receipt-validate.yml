name: Receipt Validate

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  validate-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g ajv-cli ajv-formats
      - name: Discover MCP audit receipts
        id: discover
        run: |
          mapfile -t files < <(find receipts -maxdepth 1 -type f -name '*.json' | sort)
          count=${#files[@]}
          echo "json_receipt_count=$count"
          echo "json_receipt_count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "No JSON receipts discovered under receipts/."
          else
            echo "Discovered JSON receipts:"
            printf ' - %s\n' "${files[@]}"
          fi
      - name: Validate MCP audit receipts
        if: steps.discover.outputs.json_receipt_count != '0'
        run: |
          mapfile -t files < <(find receipts -maxdepth 1 -type f -name '*.json' | sort)
          for file in "${files[@]}"; do
            echo "Validating: $file"
            ajv validate -c ajv-formats -s schemas/mcp_engine_audit_receipt.v0_1.schema.json -d "$file" --strict=false
          done
