name: Receipt Validate

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  validate-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g ajv-cli ajv-formats
      - name: Validate MCP audit receipts
        run: |
          mapfile -t files < <(find receipts -maxdepth 1 -type f -name '*.json' | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No JSON receipts to validate."
            exit 0
          fi
          echo "Found ${#files[@]} JSON receipt(s):"
          printf ' - %s\n' "${files[@]}"
          for file in "${files[@]}"; do
            echo "Validating $file"
            ajv validate -c ajv-formats -s schemas/mcp_engine_audit_receipt.v0_1.schema.json -d "$file" --strict=false
          done
