name: ALMS Run 001 PDF Receipt

on:
  workflow_dispatch:

permissions:
  contents: write

actions: read

jobs:
  build-run001-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip reportlab

      - name: Generate PDF receipt
        env:
          ALMS_GENERATED_AT_UTC: '2026-05-05T04:55:00Z'
        run: |
          python3 scripts/verify/alms_receipt_gen_hardened.py
          cat _truth/receipts/ALMS_RUN_001.pdf.sha256

      - name: Upload PDF receipt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ALMS_RUN_001_PDF_RECEIPT
          path: |
            _truth/receipts/ALMS_RUN_001.pdf
            _truth/receipts/ALMS_RUN_001.pdf.sha256
          if-no-files-found: error

      - name: Commit PDF receipt back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _truth/receipts/ALMS_RUN_001.pdf _truth/receipts/ALMS_RUN_001.pdf.sha256
          git commit -m "ALMS: add generated Run 001 PDF receipt" || echo "No changes to commit"
          git push
