name: Verify EAS Control Receipt V1

on:
  pull_request:
    branches: [master]
    paths:
      - "schemas/eas_control_receipt_v1.schema.json"
      - "tools/verify_eas_control_receipt.py"
      - "testdata/eas/v1/**"
      - "testdata/lineage-index.json"
      - ".github/workflows/verify-eas-control.yml"
  push:
    branches:
      - master
      - feat/eas-control-receipt-v1
      - chore/decay-genesis-2026-W24
    paths:
      - "schemas/eas_control_receipt_v1.schema.json"
      - "tools/verify_eas_control_receipt.py"
      - "testdata/eas/v1/**"
      - "testdata/lineage-index.json"
      - ".github/workflows/verify-eas-control.yml"

jobs:
  verify-eas-control:
    name: Schema Law / Executor / Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deterministic verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema

      - name: Compile schema law
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_path = Path("schemas/eas_control_receipt_v1.schema.json")
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          print("schema_law=COMPILES")
          PY

      - name: Invalid corpus must fail RED
        run: |
          shopt -s nullglob
          files=(testdata/eas/v1/invalid/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No invalid fixtures found" >&2
            exit 1
          fi
          python tools/verify_eas_control_receipt.py --expect-invalid --json "${files[@]}"

      - name: Valid corpus must pass GREEN
        run: |
          shopt -s nullglob
          files=(testdata/eas/v1/valid/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No valid fixtures present; skipping valid corpus gate."
            exit 0
          fi
          python tools/verify_eas_control_receipt.py --json "${files[@]}"

      - name: Pending corpus must remain PENDING or YELLOW only
        run: |
          shopt -s nullglob
          files=(testdata/eas/v1/pending/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No pending fixtures present; skipping pending corpus gate."
            exit 0
          fi
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("schemas/eas_control_receipt_v1.schema.json").read_text(encoding="utf-8"))
          validator = Draft202012Validator(schema)
          failures = []
          for path in Path("testdata/eas/v1/pending").glob("*.json"):
              data = json.loads(path.read_text(encoding="utf-8"))
              schema_errors = sorted(validator.iter_errors(data), key=lambda e: list(e.path))
              if schema_errors:
                  failures.append({"path": str(path), "error": "PENDING_SCHEMA_INVALID", "details": [e.message for e in schema_errors]})
                  continue
              if data.get("status") != "PENDING_FETCH":
                  failures.append({"path": str(path), "error": "PENDING_STATUS_INVALID", "status": data.get("status")})
              if data.get("replay_status") != "PENDING":
                  failures.append({"path": str(path), "error": "PENDING_REPLAY_STATUS_INVALID", "replay_status": data.get("replay_status")})
              if data.get("severity") not in {"YELLOW", "ORANGE"}:
                  failures.append({"path": str(path), "error": "PENDING_SEVERITY_INVALID", "severity": data.get("severity")})
              for forbidden in ("uid", "tx_hash", "artifact_hash"):
                  if data.get(forbidden):
                      failures.append({"path": str(path), "error": "PENDING_HAS_WITNESS_FIELD", "field": forbidden})
          if failures:
              print(json.dumps(failures, indent=2), file=sys.stderr)
              sys.exit(1)
          print("pending_corpus=LAWFUL")
          PY

      - name: Enforce no RED in valid corpus
        run: |
          shopt -s nullglob
          files=(testdata/eas/v1/valid/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No valid fixtures present; skipping RED scan."
            exit 0
          fi
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          files = [str(p) for p in Path("testdata/eas/v1/valid").glob("*.json")]
          proc = subprocess.run(
              [sys.executable, "tools/verify_eas_control_receipt.py", "--json", *files],
              check=False,
              text=True,
              capture_output=True,
          )
          print(proc.stdout)
          if proc.returncode != 0:
              print(proc.stderr, file=sys.stderr)
              sys.exit(proc.returncode)
          results = json.loads(proc.stdout)
          bad = [r for r in results if r.get("severity") != "GREEN" or r.get("valid") is not True or r.get("replay_status") != "PASS"]
          if bad:
              print(json.dumps(bad, indent=2), file=sys.stderr)
              sys.exit(1)
          PY
