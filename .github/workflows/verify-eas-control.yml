name: Verify EAS Control Receipt V1

on:
  pull_request:
    branches: [master]
    paths:
      - "schemas/eas_control_receipt_v1.schema.json"
      - "tools/verify_eas_control_receipt.py"
      - "testdata/eas/v1/**"
      - "testdata/lineage-index.json"
      - ".github/workflows/verify-eas-control.yml"
  push:
    branches:
      - master
      - feat/eas-control-receipt-v1
    paths:
      - "schemas/eas_control_receipt_v1.schema.json"
      - "tools/verify_eas_control_receipt.py"
      - "testdata/eas/v1/**"
      - "testdata/lineage-index.json"
      - ".github/workflows/verify-eas-control.yml"

jobs:
  verify-eas-control:
    name: Schema Law / Executor / Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deterministic verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema

      - name: Compile schema law
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_path = Path("schemas/eas_control_receipt_v1.schema.json")
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          print("schema_law=COMPILES")
          PY

      - name: Invalid fixtures must fail RED
        run: |
          shopt -s nullglob
          files=(testdata/eas/v1/invalid/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No invalid fixtures found" >&2
            exit 1
          fi
          python tools/verify_eas_control_receipt.py --expect-invalid --json "${files[@]}"

      - name: Valid fixtures must pass when present
        run: |
          shopt -s nullglob
          files=(testdata/eas/v1/valid/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No valid fixtures present yet; skipping valid corpus gate."
            exit 0
          fi
          python tools/verify_eas_control_receipt.py --json "${files[@]}"

      - name: Enforce no RED in valid corpus
        run: |
          shopt -s nullglob
          files=(testdata/eas/v1/valid/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No valid fixtures present yet; skipping RED scan."
            exit 0
          fi
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          files = [str(p) for p in Path("testdata/eas/v1/valid").glob("*.json")]
          proc = subprocess.run(
              [sys.executable, "tools/verify_eas_control_receipt.py", "--json", *files],
              check=False,
              text=True,
              capture_output=True,
          )
          print(proc.stdout)
          if proc.returncode != 0:
              print(proc.stderr, file=sys.stderr)
              sys.exit(proc.returncode)
          results = json.loads(proc.stdout)
          red = [r for r in results if r.get("severity") == "RED"]
          if red:
              print(json.dumps(red, indent=2), file=sys.stderr)
              sys.exit(1)
          PY
