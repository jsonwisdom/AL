name: ALMS Payload Replay + Contract Gates

on:
  pull_request:
    paths:
      - 'artifacts/alms/post-merge-replay/**'
      - '.github/workflows/alms-post-merge-replay.yml'
  workflow_dispatch:
    inputs:
      replay_sha:
        description: Exact Bedrock SHA to replay
        required: true
        default: 59448d850d355854956cb5834ebef17f7f14c7dc
        type: string
      cro_id:
        description: Constitutional Replay Payload identifier
        required: true
        default: CRO-PAYLOAD-001
        type: string
      replay_at:
        description: Fixed RFC3339 replay instant for deterministic payload bytes
        required: true
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Run ALMS contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s artifacts/alms/post-merge-replay/harness/tests \
            -p 'test_*.py' \
            -v

  payload-replay:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: contract-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout replay controller
        uses: actions/checkout@v4
        with:
          path: controller

      - name: Checkout exact Bedrock runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.replay_sha }}
          fetch-depth: 0
          path: runtime-root

      - name: Verify exact Bedrock checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='59448d850d355854956cb5834ebef17f7f14c7dc'
          test '${{ inputs.replay_sha }}' = "$expected"
          observed="$(git -C runtime-root rev-parse HEAD)"
          test "$observed" = "$expected"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Require runtime adapter
        env:
          ALMS_RUNTIME_COMMAND: ${{ secrets.ALMS_RUNTIME_COMMAND }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ALMS_RUNTIME_COMMAND"

      - name: Execute constitutional payload replay
        env:
          ALMS_RUNTIME_COMMAND: ${{ secrets.ALMS_RUNTIME_COMMAND }}
        shell: bash
        run: |
          set -euo pipefail
          python controller/artifacts/alms/post-merge-replay/harness/corpus_runner.py \
            --replay-sha '${{ inputs.replay_sha }}' \
            --runtime-root runtime-root \
            --matrix controller/artifacts/alms/post-merge-replay/matrix/definitions.json \
            --payload-schema controller/artifacts/alms/post-merge-replay/schemas/CRO.payload.schema.json \
            --payload-output controller/artifacts/alms/post-merge-replay/receipts/cro.payload.json \
            --cro-id '${{ inputs.cro_id }}' \
            --replay-at '${{ inputs.replay_at }}' \
            --runtime-command "$ALMS_RUNTIME_COMMAND"

      - name: Independently validate GREEN payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          root = Path('controller/artifacts/alms/post-merge-replay')
          schema = json.loads((root / 'schemas/CRO.payload.schema.json').read_text())
          payload = json.loads((root / 'receipts/cro.payload.json').read_text())
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(payload)
          if payload['replay_verdict']['status'] != 'GREEN':
              raise SystemExit('ALMS payload replay verdict is RED')
          if not all(
              item['injected'] is True
              and item['passed'] is True
              and item['observed_state'] == item['expected_state']
              for item in payload['failure_results']
          ):
              raise SystemExit('GREEN payload contains an uncontained vector')
          if payload['monotonic_counters']['monotonic'] is not True:
              raise SystemExit('GREEN payload counters are not monotonic')
          PY

      - name: Upload unsigned CRO payload
        uses: actions/upload-artifact@v4
        with:
          name: cro-payload-${{ inputs.cro_id }}
          path: controller/artifacts/alms/post-merge-replay/receipts/cro.payload.json
          if-no-files-found: error

      - name: Attach GREEN payload status to Bedrock SHA
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ inputs.replay_sha }}',
              state: 'success',
              context: 'ALMS Payload Replay',
              description: 'Unsigned constitutional replay payload validated GREEN'
            });

      - name: Attach RED payload status on failure
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ inputs.replay_sha }}',
              state: 'failure',
              context: 'ALMS Payload Replay',
              description: 'Payload replay failed or produced no admissible GREEN payload'
            });
