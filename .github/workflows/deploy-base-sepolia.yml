name: Deploy Migration Guard Resolver to Base Sepolia

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify Foundry
        run: forge --version

      - name: Install dependencies
        run: forge install || true

      - name: Build
        run: forge build

      - name: Test
        run: forge test -vvv

      - name: Confirm deploy wallet
        run: |
          cast wallet address --private-key "$PRIVATE_KEY"
          cast balance "$(cast wallet address --private-key "$PRIVATE_KEY")" \
            --rpc-url "$BASE_SEPOLIA_RPC_URL"

      - name: Deploy to Base Sepolia
        run: |
          forge script script/DeployMigrationGuardResolver.s.sol \
            --rpc-url "$BASE_SEPOLIA_RPC_URL" \
            --private-key "$PRIVATE_KEY" \
            --broadcast \
            -vvv
