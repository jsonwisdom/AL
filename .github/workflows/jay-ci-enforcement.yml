name: ALMS CI Enforcement V1

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  wisdom-enforcement:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Run Jay CI Enforcement
        run: |
          bash scripts/jay_ci_enforcement.sh

      - name: Upload CI enforcement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jay-ci-enforcement-report
          path: _truth/ci/jay_ci_enforcement_report.txt
