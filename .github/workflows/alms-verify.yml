name: ALMS Receipt Verification

on:
  push:
  pull_request:

jobs:
  verify-receipts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Ensure scripts are executable
        run: |
          chmod +x scripts/verify_receipt.sh
          chmod +x scripts/test_verify_receipt.sh

      - name: Run ALMS receipt verifier tests
        run: |
          ./scripts/test_verify_receipt.sh

      - name: Run ALMS segment verifier tests
        run: |
          chmod +x scripts/verify_segment.sh
          chmod +x scripts/test_verify_segment.sh
          ./scripts/test_verify_segment.sh

      - name: Run ALMS rollover verifier tests
        run: |
          chmod +x scripts/verify_rollover.sh
          chmod +x scripts/test_verify_rollover.sh
          ./scripts/test_verify_rollover.sh
