name: Minnesota Canonical Folder Migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry-run plans only. Apply creates a migration branch and draft PR."
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirm:
        description: "Apply only: enter MOVE_MINNESOTA_WITH_RECEIPTS"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: minnesota-canonical-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      MIGRATION_BRANCH: automation/minnesota-canonical-${{ github.run_id }}-${{ github.run_attempt }}
      PLAN_PATH: ${{ runner.temp }}/mn-migration-plan-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Configure Git identity
        run: |
          git config user.name "Minnesota Receipt Mover"
          git config user.email "minnesota-receipts@users.noreply.github.com"

      - name: Validate migration engine
        run: |
          python -m py_compile Minnesota/automation/migrate_minnesota_v1.py
          python -m json.tool Minnesota/MIGRATION_POLICY_V1.json >/dev/null
          python -m json.tool Minnesota/governance/WOMENS_OPINION_RECORD_SCHEMA_V1.json >/dev/null

      - name: Enforce apply confirmation
        if: ${{ inputs.mode == 'apply' }}
        run: |
          test "${{ inputs.confirm }}" = "MOVE_MINNESOTA_WITH_RECEIPTS" || {
            echo "APPLY_BLOCKED: exact confirmation phrase required" >&2
            exit 1
          }

      - name: Create isolated migration branch
        if: ${{ inputs.mode == 'apply' }}
        run: git checkout -b "$MIGRATION_BRANCH"

      - name: Run receipt-first migration
        run: |
          python Minnesota/automation/migrate_minnesota_v1.py \
            --mode "${{ inputs.mode }}" \
            --confirm "${{ inputs.confirm }}" \
            --run-id "github-${{ github.run_id }}-${{ github.run_attempt }}" \
            --output "$PLAN_PATH"

      - name: Add dry-run summary
        if: ${{ inputs.mode == 'dry-run' }}
        run: |
          python - "$PLAN_PATH" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print("# Minnesota migration dry-run")
          print()
          print(f"- Safe moves: **{data['move_count']}**")
          print(f"- Human-review candidates: **{data['review_count']}**")
          print(f"- Destination conflicts: **{data['conflict_count']}**")
          print(f"- Status: **{data['status']}**")
          print()
          print("No repository files were changed.")
          PY

      - name: Upload dry-run plan
        if: ${{ inputs.mode == 'dry-run' }}
        uses: actions/upload-artifact@v4
        with:
          name: minnesota-migration-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PLAN_PATH }}
          if-no-files-found: error

      - name: Validate applied migration
        if: ${{ inputs.mode == 'apply' }}
        run: |
          git diff --check
          python -m json.tool Minnesota/manifests/MN_CORPUS_MANIFEST_V1.json >/dev/null
          python -m json.tool Minnesota/receipts/migration/latest.json >/dev/null
          if [ -f verify_all.py ]; then
            python verify_all.py
          else
            echo "verify_all.py not present; migration-specific verification completed."
          fi

      - name: Commit and push migration branch
        if: ${{ inputs.mode == 'apply' }}
        id: commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "NO_CHANGES: Minnesota canonical migration is already converged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "migrate Minnesota corpus into canonical folder"
          git push -u origin "$MIGRATION_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open draft migration PR
        if: ${{ inputs.mode == 'apply' && steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/mn-pr-body.md" <<EOF
          ## Minnesota canonical-folder migration

          This draft PR was generated by the receipt-first Minnesota migration action.

          - Trigger run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Migration branch: \`$MIGRATION_BRANCH\`
          - Commit: \`${{ steps.commit.outputs.commit_sha }}\`
          - Exact apply confirmation was supplied.
          - Source/evidence bytes were preserved and re-hashed at destination.
          - Ambiguous Minnesota references remain in the human-review queue.
          - No public-content promotion or legal authority is created.

          Review these artifacts before merging:

          - \`Minnesota/manifests/MN_CORPUS_MANIFEST_V1.json\`
          - \`Minnesota/receipts/migration/latest.json\`
          - the changed workflow and script references
          - the human-review queue in the migration receipt
          EOF
          PR_URL=$(gh pr create \
            --draft \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$MIGRATION_BRANCH" \
            --title "Migrate Minnesota corpus into canonical folder" \
            --body-file "$RUNNER_TEMP/mn-pr-body.md")
          echo "Draft PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Print governance state
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'

          ## Governance state

          ```text
          NO_FAKE_GREEN                = TRUE
          HUMAN_REVIEW_REQUIRED        = TRUE
          SILENCE_IS_NOT_CONSENT       = TRUE
          MINORITY_REPORT_PRESERVED    = TRUE
          WOMENS_OPINIONS_PRESERVED    = TRUE
          PUBLIC_PROMOTION_AUTHORIZED  = FALSE
          DIRECT_MASTER_MUTATION       = FALSE
          ```
          EOF
