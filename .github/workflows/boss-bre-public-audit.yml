name: Boss Bre Public Audit

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: boss-bre-public-audit
  cancel-in-progress: false

jobs:
  forensic-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AL
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl poppler-utils python3 gh

      - name: Configure Boss Bre git identity
        run: |
          git config user.name "Boss Bre Bot"
          git config user.email "boss-bre@users.noreply.github.com"

      - name: Run Boss Bre source ingest
        run: |
          chmod +x scripts/boss_bre_fetch_extract_v0_1.sh || true
          ./scripts/boss_bre_fetch_extract_v0_1.sh

      - name: Run Boss Bre public sweep
        run: |
          chmod +x scripts/mn001_forensic_worker_v0_1.sh || true
          chmod +x scripts/boss_bre_pdf_scanner.sh || true
          chmod +x scripts/boss_bre_runner_v0_2.sh || true
          chmod +x scripts/boss_bre_anomaly_detector.sh || true
          ./scripts/boss_bre_runner_v0_2.sh

      - name: Run Boss Bre anomaly detector
        run: |
          if [ -x scripts/boss_bre_anomaly_detector.sh ]; then
            ./scripts/boss_bre_anomaly_detector.sh
          else
            echo "ANOMALY_DETECTOR_BLOCKED: script missing or not executable"
          fi

      - name: Run Boss Bre lead receipts
        run: |
          chmod +x scripts/boss_bre_lead_receipt_v0_1.sh || true
          ./scripts/boss_bre_lead_receipt_v0_1.sh

      - name: Run Boss Bre simulated artifact scan v1.5
        run: |
          chmod +x projects/mn-fiscal-replay/boss_bre/BOSS_BRE_SIMULATED_ARTIFACT_CLEANUP_V1_5.sh || true
          if [ -x projects/mn-fiscal-replay/boss_bre/BOSS_BRE_SIMULATED_ARTIFACT_CLEANUP_V1_5.sh ]; then
            ./projects/mn-fiscal-replay/boss_bre/BOSS_BRE_SIMULATED_ARTIFACT_CLEANUP_V1_5.sh
          else
            echo "SIMULATED_ARTIFACT_SCAN_BLOCKED: v1.5 script missing or not executable"
          fi

      - name: Commit Boss Bre artifacts if changed
        run: |
          git add projects/mn-fiscal-replay/boss_bre || true
          git add projects/mn-fiscal-replay/live_fetch || true
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "Boss Bre v1.6: automated sweep routing $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "No Boss Bre artifacts to commit."
          fi

      - name: Run Librarian update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOSS_BRE_MASTER_ISSUE: "348"
        run: |
          python3 scripts/boss_bre_librarian.py

      - name: Print gate status
        run: |
          cat <<'EOF'
          NO_FAKE_GREEN: ACTIVE
          PUBLIC_CONTENT_CLAIM: BLOCKED_PENDING_HUMAN_REVIEW
          HUMAN_REVIEW_REQUIRED: TRUE
          WORKFLOW_ROUTING_VERSION: v1.6
          EOF
