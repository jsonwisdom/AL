name: Boss Bre Public Audit

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: boss-bre-public-audit
  cancel-in-progress: false

jobs:
  forensic-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AL without push credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl poppler-utils python3 gh

      - name: Run Boss Bre source ingest
        run: |
          chmod +x scripts/boss_bre_fetch_extract_v0_1.sh || true
          ./scripts/boss_bre_fetch_extract_v0_1.sh

      - name: Run Boss Bre public sweep
        run: |
          chmod +x scripts/mn001_forensic_worker_v0_1.sh || true
          chmod +x scripts/boss_bre_pdf_scanner.sh || true
          chmod +x scripts/boss_bre_runner_v0_2.sh || true
          chmod +x scripts/boss_bre_anomaly_detector.sh || true
          ./scripts/boss_bre_runner_v0_2.sh

      - name: Run Boss Bre anomaly detector
        run: |
          if [ -x scripts/boss_bre_anomaly_detector.sh ]; then
            ./scripts/boss_bre_anomaly_detector.sh
          else
            echo "ANOMALY_DETECTOR_BLOCKED: script missing or not executable"
          fi

      - name: Run Boss Bre lead receipts
        run: |
          chmod +x scripts/boss_bre_lead_receipt_v0_1.sh || true
          ./scripts/boss_bre_lead_receipt_v0_1.sh

      - name: Run Boss Bre simulated artifact scan v1.5
        run: |
          chmod +x projects/mn-fiscal-replay/boss_bre/BOSS_BRE_SIMULATED_ARTIFACT_CLEANUP_V1_5.sh || true
          if [ -x projects/mn-fiscal-replay/boss_bre/BOSS_BRE_SIMULATED_ARTIFACT_CLEANUP_V1_5.sh ]; then
            ./projects/mn-fiscal-replay/boss_bre/BOSS_BRE_SIMULATED_ARTIFACT_CLEANUP_V1_5.sh
          else
            echo "SIMULATED_ARTIFACT_SCAN_BLOCKED: v1.5 script missing or not executable"
          fi

      - name: Enforce generated-output boundary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //')

          for path in "${changed[@]}"; do
            case "$path" in
              projects/mn-fiscal-replay/boss_bre/*|projects/mn-fiscal-replay/live_fetch/*)
                ;;
              *)
                echo "WRITE_BOUNDARY_VIOLATION: $path"
                exit 1
                ;;
            esac
          done

          printf '%s\n' "${changed[@]}" > /tmp/boss-bre-changed-files.txt
          echo "GENERATED_OUTPUT_BOUNDARY: PASS"

      - name: Build review artifact bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle=/tmp/boss-bre-artifacts
          mkdir -p "$bundle/projects/mn-fiscal-replay"

          if [ -d projects/mn-fiscal-replay/boss_bre ]; then
            cp -a projects/mn-fiscal-replay/boss_bre "$bundle/projects/mn-fiscal-replay/"
          fi
          if [ -d projects/mn-fiscal-replay/live_fetch ]; then
            cp -a projects/mn-fiscal-replay/live_fetch "$bundle/projects/mn-fiscal-replay/"
          fi

          cp /tmp/boss-bre-changed-files.txt "$bundle/changed-files.txt"
          git diff --stat > "$bundle/diff-stat.txt"
          git diff --binary > "$bundle/generated-output.patch"

          cat > "$bundle/provenance.json" <<EOF
          {
            "artifact_class": "GENERATED_EVIDENCE",
            "repository": "${GITHUB_REPOSITORY}",
            "source_commit": "${GITHUB_SHA}",
            "workflow": "${GITHUB_WORKFLOW}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "ref": "${GITHUB_REF}",
            "authority": false,
            "promotion": false,
            "default_branch_mutated": false,
            "human_review_required": true
          }
          EOF

      - name: Upload Boss Bre generated evidence
        uses: actions/upload-artifact@v4
        with:
          name: boss-bre-generated-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/boss-bre-artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Run Librarian update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOSS_BRE_MASTER_ISSUE: "348"
        run: |
          python3 scripts/boss_bre_librarian.py

      - name: Print gate status
        run: |
          cat <<'EOF'
          NO_FAKE_GREEN: ACTIVE
          PUBLIC_CONTENT_CLAIM: BLOCKED_PENDING_HUMAN_REVIEW
          HUMAN_REVIEW_REQUIRED: TRUE
          DEFAULT_BRANCH_MUTATION: BLOCKED
          GENERATED_EVIDENCE: WORKFLOW_ARTIFACT_ONLY
          WORKFLOW_ROUTING_VERSION: v1.7-review-artifacts
          EOF
