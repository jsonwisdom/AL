name: Alabama Engine Base Resolver Observation
on:
  pull_request:
    paths:
      - 'scripts/ens/alabama_engine_base_probe_v0_1.mjs'
      - '.github/workflows/alabama-engine-base-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe-base:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked repository dependencies
        run: npm ci --ignore-scripts
      - name: Deterministic ABI/namehash/hash self-test
        run: node scripts/ens/alabama_engine_base_probe_v0_1.mjs --self-test
      - name: Read Base 8453 at a pinned common block via two RPCs
        run: node scripts/ens/alabama_engine_base_probe_v0_1.mjs
      - name: Display provisional state (NEVER GREEN)
        if: always()
        run: |
          if test -f artifacts/alabama_engine_base_probe_v0_1.json; then
            jq '{status, reason_code, subject_name, chain_id, block_number_or_resolution_epoch, block_hash, resolver_address_or_endpoint, txt_records_sha256, missing_keys, provenance_level, no_fake_green}' artifacts/alabama_engine_base_probe_v0_1.json
            sha256sum artifacts/alabama_engine_base_probe_v0_1.json
          fi
      - name: Upload immutable run-scoped observation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alabama-engine-base-probe-${{ github.run_id }}
          path: artifacts/alabama_engine_base_probe_v0_1.json
          if-no-files-found: error
