name: Continuity Fabric Soak

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - master
    paths:
      - 'continuity-fabric/**'
      - 'scripts/freeze_schemas_v1.js'
      - '.github/workflows/continuity-fabric-soak.yml'
      - '.github/workflows/continuity-fabric-harness.yml'

permissions:
  contents: read
  actions: read

jobs:
  schema-integrity:
    name: schema-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Recompute freeze artifacts
        run: node scripts/freeze_schemas_v1.js

      - name: Assert frozen schema ledger unchanged
        run: git diff --exit-code -- continuity-fabric/schemas/FROZEN_v1.0.0.sha256 continuity-fabric/receipts

  vector-valid-policy-reload:
    name: vector-valid-policy-reload
    runs-on: ubuntu-latest
    needs: schema-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run valid policy reload vector
        run: npx vitest run continuity-fabric/test/harness/valid_policy_reload.spec.ts

  vector-unknown-issuer:
    name: vector-unknown-issuer
    runs-on: ubuntu-latest
    needs: schema-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unknown issuer vector
        run: npx vitest run continuity-fabric/test/harness/unknown_issuer.spec.ts

  vector-emergency-kill-switch:
    name: vector-emergency-kill-switch
    runs-on: ubuntu-latest
    needs: schema-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run emergency kill switch vector
        run: npx vitest run continuity-fabric/test/harness/emergency_kill_switch.spec.ts

  soak-evaluate:
    name: soak-evaluate-24h-zero-flake
    runs-on: ubuntu-latest
    needs:
      - schema-integrity
      - vector-valid-policy-reload
      - vector-unknown-issuer
      - vector-emergency-kill-switch
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Evaluate last 24 completed soak runs
        run: |
          set -euo pipefail

          runs_json="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "Continuity Fabric Soak" \
            --branch master \
            --status completed \
            --limit 24 \
            --json conclusion,databaseId,headSha,createdAt)"

          count="$(printf '%s' "$runs_json" | jq 'length')"
          failures="$(printf '%s' "$runs_json" | jq '[.[] | select(.conclusion != "success")] | length')"

          echo "completed_soak_runs=$count"
          echo "non_success_soak_runs=$failures"

          if [ "$count" -lt 24 ]; then
            echo "SOAK_PENDING: need 24 completed successful runs before v1.0.0 tag is lawful."
            exit 1
          fi

          if [ "$failures" -ne 0 ]; then
            echo "SOAK_FAILED: at least one of the last 24 completed soak runs was not successful. Clock resets."
            exit 1
          fi

          echo "SOAK_PASSED: last 24 completed soak runs are green. #372 release gate may proceed to manual review."
