name: Alabama Engine Expiry Enforcer

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
  pull_request:
  workflow_dispatch:

jobs:
  expiry-enforcer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Enforce Alabama Engine YELLOW expiry
        run: bash scripts/ens/alabama_engine_expiry_enforcer.sh
