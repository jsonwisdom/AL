name: Reflection Provenance Health

on:
  push:
    paths:
      - 'Reflection/**'
      - '.github/workflows/reflection-provenance-health.yml'
  pull_request:
    paths:
      - 'Reflection/**'
  workflow_dispatch:

jobs:
  verify-m2-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Reflection ledger files exist
        run: |
          test -f Reflection/ledger/receipts/M2-verification-receipt.json
          test -f Reflection/ledger/events/M2-publication-replay.json
          test -f Reflection/schemas/graph-node.schema.json
          test -f Reflection/schemas/graph-event.schema.json
          test -f Reflection/server/src/services/graphService.ts
          test -f Reflection/docs/authority-rules.md

      - name: Verify byte lengths and SHA-256 of schemas + service
        run: |
          set -euo pipefail
          echo "7a96ff4b109e6b2b9028661fa63eada5550b3e85194cf6c42692b7161bf93a01  Reflection/schemas/graph-node.schema.json" | sha256sum -c
          echo "aa3a4f26b7c002dbdeae104bf35cd22b110bc234edfa342e471757e21f3d389d  Reflection/schemas/graph-event.schema.json" | sha256sum -c
          echo "8fa6ad87ce680f217904e513824dc35979c2993d1a7c8f064d42f4aa608ae163  Reflection/server/src/services/graphService.ts" | sha256sum -c
          test "$(wc -c < Reflection/schemas/graph-node.schema.json)" -eq 3291
          test "$(wc -c < Reflection/schemas/graph-event.schema.json)" -eq 8294
          test "$(wc -c < Reflection/server/src/services/graphService.ts)" -eq 54207

      - name: Confirm authority rules present
        run: |
          grep -q "does \*\*not\*\* authorize" Reflection/docs/authority-rules.md
          grep -q "signing_authorized" Reflection/ledger/events/M2-publication-replay.json || true
