name: Verify Ledger Constitution

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        run: python -m pip install jsonschema

      - name: Run constitution gate
        run: python -m irl verify-ledger claims/ --schema ledger_schema.json

      - name: Upload claims on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-claims
          path: claims/
          retention-days: 7
