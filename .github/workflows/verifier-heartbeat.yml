name: Verifier Heartbeat

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'verifier/**'
      - '.github/workflows/verifier-heartbeat.yml'

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifier

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        run: cargo test --all --verbose
