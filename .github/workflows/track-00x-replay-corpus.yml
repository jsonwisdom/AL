name: TRACK_00X_10 Deterministic Replay Corpus

on:
  push:
    branches:
      - master
      - main
      - 'release/**'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deterministic_replay_corpus:
    name: TRACK_00X_10 — Deterministic Replay Corpus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run deterministic replay corpus
        run: python ci/replay_corpus_runner.py

      - name: Upload corpus report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus_report
          path: ci/corpus_report.json
