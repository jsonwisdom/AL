name: TRACK_00X_10 Deterministic Replay Corpus

on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    paths:
      - 'ci/replay_corpus_runner.py'
      - 'ci/**'
      - 'corpus/**'
      - '.github/workflows/track-00x-replay-corpus.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'ci/replay_corpus_runner.py'
      - 'ci/**'
      - 'corpus/**'
      - '.github/workflows/track-00x-replay-corpus.yml'
  workflow_dispatch:

jobs:
  deterministic_replay_corpus:
    name: TRACK_00X_10 — Deterministic Replay Corpus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run deterministic replay corpus
        run: |
          if [ ! -d corpus ]; then
            mkdir -p ci
            cat > ci/corpus_report.json <<'JSON'
          {
            "total_cases": 0,
            "pass": 0,
            "fail": 0,
            "indeterminate": 1,
            "failed_cases": [
              {
                "case": null,
                "reason": "missing_corpus_root"
              }
            ],
            "verdict": "INDETERMINATE_BOOTSTRAP"
          }
          JSON
            echo "TRACK_00X_10 bootstrap: corpus/ is not present yet; emitted indeterminate report."
            exit 0
          fi
          python ci/replay_corpus_runner.py

      - name: Upload corpus report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus_report
          path: ci/corpus_report.json
