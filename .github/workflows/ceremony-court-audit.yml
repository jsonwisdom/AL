name: Ceremony Court Audit

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '_truth/governance/**'
      - 'scripts/audit_ceremony_completion.sh'
      - '.github/workflows/ceremony-court-audit.yml'

jobs:
  audit:
    name: Run Ceremony Completion Audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout constitutional repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run audit script
        run: |
          chmod +x scripts/audit_ceremony_completion.sh
          bash scripts/audit_ceremony_completion.sh

      - name: Generate audit receipt on PASS
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > _truth/governance/CEREMONY_AUDIT_RECEIPT_001.json <<EOF
          {
            "receipt_id": "CEREMONY_AUDIT_001",
            "court": "Ceremony Court",
            "audit_status": "PASS",
            "eligible_for_completion_receipt": true,
            "timestamp_utc": "${TIMESTAMP}",
            "audited_by": "scripts/audit_ceremony_completion.sh",
            "workflow_run": "${{ github.run_id }}"
          }
EOF

      - name: Commit audit receipt
        run: |
          git config user.name "AL Verifier Bot"
          git config user.email "verifier@al.truth"
          git add _truth/governance/CEREMONY_AUDIT_RECEIPT_001.json
          git diff --cached --quiet || git commit -m "constitutional: ceremony audit receipt PASS [skip ci]"
          git push
