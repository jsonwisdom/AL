name: Verify FED-AI-2026-006

on:
  push:
    paths:
      - 'docs/fed-ai-2026-006/**'
      - '.github/workflows/fed-ai-2026-006-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run FED-AI-2026-006 replay
        run: |
          cd docs/fed-ai-2026-006
          chmod +x reproduce.sh
          ./reproduce.sh
