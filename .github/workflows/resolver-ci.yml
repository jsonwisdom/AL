name: resolver-ci

on:
  workflow_dispatch:
  push:
    branches: [ master, main, develop ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pinned Foundry dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify submodule dependency files
        run: |
          git submodule status --recursive
          test -f lib/openzeppelin-contracts/contracts/access/Ownable.sol
          test -f lib/openzeppelin-contracts/contracts/token/ERC721/ERC721.sol
          test -f lib/forge-std/src/Test.sol
          test -f lib/eas-contracts/contracts/IEAS.sol

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build
        run: forge build --sizes --extra-output-files bin

      - name: Test
        run: forge test -vvv --gas-report

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resolver-build
          path: out/
