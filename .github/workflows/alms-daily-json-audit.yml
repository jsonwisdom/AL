name: ALMS Daily JSON Audit

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build daily JSON audit report
        run: bash scripts/audit/build_ipfs_daily_json_report.sh

      - name: Verify daily JSON audit report
        run: bash scripts/audit/verify_ipfs_daily_json_report.sh

      - name: Commit audit report
        run: |
          git config user.name "alms-audit-bot"
          git config user.email "actions@github.com"
          git add _truth/audit docs/audit
          git commit -m "Add daily ALMS JSON audit report" || exit 0
          git push
