name: GOBLIN_RECEIPT_CLERK_CHECK

on:
  pull_request:
    paths:
      - 'docs/goblin/reaction-windows/**/*.md'
      - 'docs/goblin/reaction-windows/*.md'
      - '.github/actions/alms-validator/action.yml'
      - '.github/workflows/goblin-receipt-clerk-check.yml'

permissions:
  contents: read

jobs:
  validate-reaction-window-receipts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed reaction-window receipts
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --depth=1 || true

          mapfile -t FILES < <(
            git diff --name-only origin/main...HEAD \
              | grep -E '^docs/goblin/reaction-windows/.*\.md$' \
              || true
          )

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No reaction-window receipts changed."
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "${FILES[@]}" > /tmp/alms_receipt_files.txt
          {
            echo 'files<<EOF'
            cat /tmp/alms_receipt_files.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run ALMS validator on changed receipts
        if: steps.changed.outputs.files != ''
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r target; do
            echo "Validating receipt: $target"
            echo "target=$target" >> /tmp/alms_current_target.env
            ./.github/actions/alms-validator/action.yml >/dev/null 2>&1 || true
          done <<< "${{ steps.changed.outputs.files }}"

      - name: Validate changed receipts through composite action
        if: steps.changed.outputs.files != ''
        uses: ./.github/actions/alms-validator
        with:
          target_path: docs/goblin/reaction-windows/PLACEHOLDER.md
