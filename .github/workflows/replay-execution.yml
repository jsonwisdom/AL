name: Replay Execution v0.2

on:
  push:
    branches: [ master, main ]
    paths:
      - 'contracts/replay/v0.1/**'
      - 'contracts/replay/v0.2/**'
      - 'contracts/keys/v0.1/**'
      - 'contracts/invocation/v0.1/**'
      - 'verify.sh'
      - '.github/workflows/replay-execution.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'contracts/replay/v0.1/**'
      - 'contracts/replay/v0.2/**'
      - 'contracts/keys/v0.1/**'
      - 'contracts/invocation/v0.1/**'
      - 'verify.sh'
      - '.github/workflows/replay-execution.yml'

jobs:
  replay-execution-gate:
    name: Replay Execution Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execution Contract Present
        run: test -f contracts/replay/v0.1/EXECUTION.md

      - name: Execution Handler Present
        run: test -f contracts/replay/v0.1/execute_invocation.py

      - name: Verify Invocation Mode Present
        run: grep -q -- '--invocation' verify.sh

      - name: Signature Verifier Present
        run: test -f contracts/replay/v0.1/verify_envelope_signature.py

      - name: Revocation Registry Fixture Present
        run: test -f contracts/keys/v0.1/registry_v1_inactive.json

      - name: Replay v0.2 Invocation Schema Present
        run: test -f contracts/replay/v0.2/invocation.schema.json

      - name: Replay v0.2 Command Grammar Present
        run: test -f contracts/replay/v0.2/COMMANDS.md

      - name: Replay v0.2 Check Policy Golden Present
        run: test -f contracts/replay/v0.2/golden_check_policy.json

      - name: Replay v2 Signed Golden Invocation Present
        run: test -f contracts/replay/v0.2/golden_check_policy_v2_signed.json

      - name: Replay v2 Signed Envelope Present
        run: test -f contracts/replay/v0.2/golden_check_policy_v2_envelope.json

      - name: Replay Handler Has Command Allowlist
        run: grep -q 'ALLOWED_REPLAY_COMMANDS' contracts/replay/v0.1/execute_invocation.py

      - name: Provision replay-bin
        run: sudo bash contracts/replay/v0.2/provision_replay_bin.sh

      - name: Run check_policy golden convergence
        run: |
          set -euo pipefail
          ./verify.sh --invocation contracts/replay/v0.2/golden_check_policy.json | tee verdict.json
          grep -q '"state":"REPLAY_CONVERGED"' verdict.json
          grep -q '"replay_command":"check_policy"' verdict.json

      - name: Assert v1 inactive key refusal
        env:
          ALMS_KEY_REGISTRY: contracts/keys/v0.1/registry_v1_inactive.json
        run: |
          set +e
          ./verify.sh --invocation contracts/replay/v0.2/golden_check_policy.json | tee verdict_revoked.json
          status=$?
          set -e
          test "$status" -ne 0
          grep -q '"state":"REPLAY_REFUSED"' verdict_revoked.json
          grep -q '"reason":"SIGNATURE_INVALID"' verdict_revoked.json

      - name: Run rotated key v2 golden convergence
        run: |
          set -euo pipefail
          ./verify.sh --invocation contracts/replay/v0.2/golden_check_policy_v2_signed.json | tee verdict_v2.json
          grep -q '"state":"REPLAY_CONVERGED"' verdict_v2.json
          grep -q '"replay_command":"check_policy"' verdict_v2.json

      - name: Replay Execution Verdict
        run: echo "REPLAY_EXECUTION_V0_2_REVOCATION_GREEN"
