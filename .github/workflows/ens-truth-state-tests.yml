name: ENS Truth-State Unit Tests
on:
  pull_request:
    paths:
      - 'scripts/ens_truth_state.mjs'
      - 'scripts/ens_txt_byte_checker.mjs'
      - 'tests/ens_truth_state.test.mjs'
      - '.github/workflows/ens-truth-state-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ens-truth-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  truth-state-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check scripts/ens_truth_state.mjs
          node --check tests/ens_truth_state.test.mjs
      - name: Run offline fail-closed tests and retain TAP
        run: |
          mkdir -p artifacts/ens-ci
          node --test tests/ens_truth_state.test.mjs | tee artifacts/ens-ci/tests.tap
          test ${PIPESTATUS[0]} -eq 0
      - name: Bind test receipt to checkout and PR head
        if: always()
        env:
          CHECKOUT_SHA: ${{ github.sha }}
          TESTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          mkdir -p artifacts/ens-ci
          jq -n --arg checkout "$CHECKOUT_SHA" --arg head "$TESTED_HEAD_SHA" --arg run "$RUN_ID" --arg attempt "$RUN_ATTEMPT" --arg workflow "$WORKFLOW_REF" \
            '{schema:"CW_ENS_CI_RECEIPT_V1",checkout_sha:$checkout,tested_head_sha:$head,run_id:$run,run_attempt:$attempt,workflow_ref:$workflow}' > artifacts/ens-ci/receipt.json
          (cd artifacts/ens-ci && sha256sum *.tap *.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ens-truth-state-test-receipt
          path: artifacts/ens-ci/
          if-no-files-found: error
          retention-days: 30
