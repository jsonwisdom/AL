name: Cleansing Gate Merkle Validator

on:
  pull_request:
    paths:
      - "x-files-alien-files-26/privacy/cleansing-gate/**"
      - ".github/workflows/merkle-validator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merkle-validator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: x-files-alien-files-26/privacy/cleansing-gate/src/validator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: x-files-alien-files-26/privacy/cleansing-gate/src/validator/go.mod

      - name: Run validator tests
        run: go test ./... -v

      - name: Build CLI bridge
        run: go build ./cmd/merkle-validator
