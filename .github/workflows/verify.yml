name: Sovereign Replay Court — Membrane Guard

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  stranger-court:
    name: "Stranger Test — Execution ≡ Registry"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Prepare Environment
        run: |
          chmod +x verify.sh

      - name: Execute Public Oath (Clerk)
        run: ./verify.sh

      - name: Court Verdict
        if: success()
        run: echo "🟢 MEMBRANE_HOLDING: Execution ≡ Registry verified by stranger runner"
