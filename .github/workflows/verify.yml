name: verify
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: chmod +x verify.sh docs/protocols/vclp/verify.sh studio/watchers/claim_emitter.sh
      - run: ./verify.sh
