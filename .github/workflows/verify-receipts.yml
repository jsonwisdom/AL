name: Verify Receipts (V0 + V1)

on:
  push:
    branches: [ master, main, feat/*, fix/* ]
  pull_request:
    branches: [ master, main ]

jobs:
  verify-fixtures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: V0 valid fixture
        run: python tools/verify_fixture.py testdata/v0/valid/receipt-valid.json testdata/v0/valid/binding.json testdata/v0/valid/policy.json

      - name: V0 tampered fixture
        run: |
          output=$(python tools/verify_fixture.py testdata/v0/invalid/receipt-tampered-signature.json testdata/v0/valid/binding.json testdata/v0/valid/policy.json)
          echo "$output"
          echo "$output" | grep -q "FAIL: signature mismatch"

      - name: V1 public_key valid fixture
        run: python tools/verify_fixture.py testdata/v1/valid/receipt-public-key-valid.json testdata/v1/valid/binding.json testdata/v1/valid/policy.json

      - name: V1 did key stub fixture
        run: |
          output=$(python tools/verify_fixture.py testdata/v1/valid/receipt-did-key-valid.json testdata/v1/valid/binding.json testdata/v1/valid/policy.json)
          echo "$output"
          echo "$output" | grep -q "FAIL: did resolution unsupported"

      - name: V1 invalid fixtures
        run: |
          output=$(python tools/verify_fixture.py testdata/v1/invalid/receipt-missing-key.json testdata/v1/valid/binding.json testdata/v1/valid/policy.json)
          echo "$output"
          echo "$output" | grep -q "FAIL: public key missing"

          output=$(python tools/verify_fixture.py testdata/v1/invalid/receipt-invalid-public-key.json testdata/v1/valid/binding.json testdata/v1/valid/policy.json)
          echo "$output"
          echo "$output" | grep -q "FAIL: public key invalid"

          output=$(python tools/verify_fixture.py testdata/v1/invalid/receipt-unsupported-did.json testdata/v1/valid/binding.json testdata/v1/valid/policy.json)
          echo "$output"
          echo "$output" | grep -q "FAIL: did resolution unsupported"

          output=$(python tools/verify_fixture.py testdata/v1/invalid/receipt-tampered-signature.json testdata/v1/valid/binding.json testdata/v1/valid/policy.json)
          echo "$output"
          echo "$output" | grep -q "FAIL: signature mismatch"

      - name: Node parity V1 public_key and V0
        run: |
          node tools/verify_fixture.js testdata/v1/valid/receipt-public-key-valid.json testdata/v1/valid/binding.json testdata/v1/valid/policy.json
          node tools/verify_fixture.js testdata/v0/valid/receipt-valid.json testdata/v0/valid/binding.json testdata/v0/valid/policy.json
