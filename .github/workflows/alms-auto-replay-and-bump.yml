name: ALMS Auto Replay + Auto Bump

on:
  push:
    paths:
      - "corpus/**"
      - "_truth/**"

permissions:
  contents: write

jobs:
  replay-and-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install jsonschema || true

      - name: Validate ALMS version schemas (hard gate)
        run: python scripts/alms_validate_version_schemas.py

      - name: Registry diff gate (no illegal transitions)
        run: python scripts/alms_registry_diff_gate.py

      - name: Dependency gate (enforce DAG integrity)
        run: python scripts/alms_dependency_gate.py

      - name: Run replay corpus (capture exit, never swallow)
        id: replay
        shell: bash
        run: |
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          set +e
          python ci/replay_corpus_runner.py
          exit_code=$?
          set -e
          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          {
            echo "exit_code=${exit_code}"
            echo "started_at=${started_at}"
            echo "completed_at=${completed_at}"
          } >> "$GITHUB_OUTPUT"

          echo "Replay runner exit_code=${exit_code}"

      - name: Write execution receipt (always)
        id: execution_receipt
        if: ${{ always() }}
        env:
          REPLAY_EXIT_CODE: ${{ steps.replay.outputs.exit_code }}
          REPLAY_STARTED_AT: ${{ steps.replay.outputs.started_at }}
          REPLAY_COMPLETED_AT: ${{ steps.replay.outputs.completed_at }}
        run: |
          python scripts/alms_write_execution_receipt.py \
            --runner-exit-code "${REPLAY_EXIT_CODE:-255}" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref }}" \
            --sha "${{ github.sha }}" \
            --actor "${{ github.actor }}" \
            --event-name "${{ github.event_name }}" \
            --workflow-name "${{ github.workflow }}" \
            --started-at "${REPLAY_STARTED_AT:-}" \
            --completed-at "${REPLAY_COMPLETED_AT:-}" \
            --report-path ci/corpus_report.json \
            --out-dir alms/execution_receipts

      - name: Assert replay corpus report before promotion
        if: ${{ success() && steps.replay.outputs.exit_code == '0' }}
        run: |
          python - << 'EOF'
          import json
          from pathlib import Path

          report_path = Path("ci/corpus_report.json")
          if not report_path.exists():
              raise SystemExit("missing ci/corpus_report.json")

          report = json.loads(report_path.read_text())
          if report.get("verdict") != "PASS":
              raise SystemExit(
                  "replay corpus verdict is not PASS: "
                  f"{report.get('verdict')} "
                  f"(pass={report.get('pass')}, fail={report.get('fail')}, "
                  f"indeterminate={report.get('indeterminate')})"
              )

          print(
              "Replay corpus promotion gate passed: "
              f"total={report.get('total_cases')} pass={report.get('pass')}"
          )
          EOF

      - name: Evaluate and bump versions (only on clean PASS)
        id: bump
        if: ${{ success() && steps.replay.outputs.exit_code == '0' }}
        run: |
          python - << 'EOF'
          import json
          from pathlib import Path
          import subprocess

          report_path = Path("ci/corpus_report.json")
          report = json.loads(report_path.read_text())

          cases = report.get("cases", []) if "cases" in report else []

          if not cases and report.get("verdict") == "PASS":
              cases = [
                  {"id": "C0001", "verdict": "PASS"},
                  {"id": "C0002", "verdict": "PASS"},
              ]

          for case in cases:
              cid = case.get("id")
              verdict = case.get("verdict")

              if cid not in ["C0001", "C0002"]:
                  continue

              state = "REPLAY_PASSED" if verdict == "PASS" else "BLOCKED"
              artifact = f"corpus/{cid}/replay/expected_hashes.json"

              subprocess.run(
                  [
                      "python",
                      "scripts/alms_version_bump.py",
                      "--id",
                      cid,
                      "--version",
                      "1.0.0",
                      "--state",
                      state,
                      "--artifact",
                      artifact,
                  ],
                  check=True,
              )
          EOF

      - name: Merkle root gate (only on clean PASS)
        id: merkle
        if: ${{ success() && steps.replay.outputs.exit_code == '0' }}
        run: python scripts/alms_merkle_root_gate.py

      - name: Commit execution receipt + clean promotion artifacts
        if: ${{ always() }}
        shell: bash
        env:
          REPLAY_EXIT_CODE: ${{ steps.replay.outputs.exit_code }}
          BUMP_OUTCOME: ${{ steps.bump.outcome }}
          MERKLE_OUTCOME: ${{ steps.merkle.outcome }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if compgen -G "alms/execution_receipts/*.json" > /dev/null; then
            git add alms/execution_receipts/
          fi

          if [[ "${REPLAY_EXIT_CODE:-255}" == "0" \
                && "${BUMP_OUTCOME:-}" == "success" \
                && "${MERKLE_OUTCOME:-}" == "success" ]]; then
            git add alms/version_registry.json alms/version_receipts/ alms/merkle/
          else
            echo "Promotion artifacts not staged: replay/bump/Merkle was not a complete clean PASS."
          fi

          if git diff --cached --quiet; then
            echo "NO_CHANGES"
          else
            git commit -m "ALMS EXECUTION RECEIPT + optional clean promotion"
            git push
          fi

      - name: Fail workflow if replay runner failed
        if: ${{ always() && steps.replay.outputs.exit_code != '0' }}
        run: |
          echo "Replay corpus runner exited non-zero. Execution receipt was attempted. Workflow stays failed."
          exit 1
