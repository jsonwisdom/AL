name: Verify Claims

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure core scripts are executable
        run: |
          chmod +x verify.sh || true
          find scripts -type f -name "*.sh" -exec chmod +x {} \; || true
          find docs -type f -name "*.sh" -exec chmod +x {} \; || true

      - name: Run core AL verification
        run: |
          bash verify.sh

      - name: Check receipt JSON syntax
        run: |
          if [ -d receipts ]; then
            find receipts -type f -name "*.json" -print0 | xargs -0 -r -n1 jq empty
          fi

      - name: Check claim JSON syntax
        run: |
          if [ -d claims ]; then
            find claims -type f -name "*.json" -print0 | xargs -0 -r -n1 jq empty
          fi

      - name: Check verified claims manifest
        run: |
          bash scripts/check_verified_claims_manifest.sh

      - name: Verify public proof artifacts exist
        run: |
          test -f verify.sh
          test -d docs
          test -d receipts
          test -f docs/verified-claims.json
