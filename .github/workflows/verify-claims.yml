name: Verify Claims

on:
  push:
    branches: [master]
    paths:
      - 'claims/**'
      - 'docs/verified-claims.json'
      - 'docs/ipfs-anchor.txt'
      - 'docs/index.html'
      - 'verify.sh'
      - 'scripts/build_verified_claims_manifest.sh'
      - 'scripts/check_verified_claims_manifest.sh'
      - 'scripts/verify_verified_claims_root.sh'
      - '.github/workflows/verify-claims.yml'
  pull_request:
    branches: [master]
    paths:
      - 'claims/**'
      - 'docs/verified-claims.json'
      - 'docs/ipfs-anchor.txt'
      - 'docs/index.html'
      - 'verify.sh'
      - 'scripts/build_verified_claims_manifest.sh'
      - 'scripts/check_verified_claims_manifest.sh'
      - 'scripts/verify_verified_claims_root.sh'
      - '.github/workflows/verify-claims.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure scripts executable
        run: |
          chmod +x verify.sh || true
          find scripts -type f -name "*.sh" -exec chmod +x {} \; || true

      - name: Run core AL verification
        run: bash verify.sh

      - name: Build manifest (source of truth)
        run: bash scripts/build_verified_claims_manifest.sh

      - name: Check manifest matches committed file
        run: |
          git diff --exit-code docs/verified-claims.json || (echo "MANIFEST_DRIFT" && exit 1)

      - name: Run manifest integrity check
        run: bash scripts/check_verified_claims_manifest.sh

      - name: Verify anchored claims root
        run: bash scripts/verify_verified_claims_root.sh

      - name: Validate JSON files
        run: |
          find claims -type f -name "*.json" -print0 | xargs -0 -r -n1 jq empty
          jq empty docs/verified-claims.json

      - name: Check public artifacts
        run: |
          test -f docs/index.html
          test -f docs/verified-claims.json
          test -f docs/ipfs-anchor.txt
