name: Build Citable Distribution Layer

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'dist/**'
      - '.github/workflows/build-dist.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc and TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-base texlive-latex-recommended texlive-fonts-recommended

      - name: Prepare PDF output directory
        run: mkdir -p dist/pdf

      - name: Set version stamp
        id: stamp
        run: |
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Render law review article
        run: |
          pandoc docs/legal/DUE_PROCESS_AT_MACHINE_SPEED.md \
            -o dist/pdf/due-process-at-machine-speed.pdf \
            --pdf-engine=xelatex \
            -V geometry:margin=1in \
            -V fontsize=12pt \
            -V linestretch=2
          cp dist/pdf/due-process-at-machine-speed.pdf "dist/pdf/due-process-at-machine-speed-${{ steps.stamp.outputs.date }}-${{ steps.stamp.outputs.short_sha }}.pdf"

      - name: Render judicial opinion
        run: |
          pandoc docs/legal/MODEL_JUDICIAL_OPINION.md \
            -o dist/pdf/model-judicial-opinion.pdf \
            --pdf-engine=xelatex \
            -V geometry:margin=1in \
            -V fontsize=12pt
          cp dist/pdf/model-judicial-opinion.pdf "dist/pdf/model-judicial-opinion-${{ steps.stamp.outputs.date }}-${{ steps.stamp.outputs.short_sha }}.pdf"

      - name: Render public explainer
        run: |
          pandoc docs/public/THE_COMPUTER_SAID_NO.md \
            -o dist/pdf/the-computer-said-no.pdf \
            --pdf-engine=xelatex \
            -V geometry:margin=0.75in \
            -V fontsize=12pt
          cp dist/pdf/the-computer-said-no.pdf "dist/pdf/the-computer-said-no-${{ steps.stamp.outputs.date }}-${{ steps.stamp.outputs.short_sha }}.pdf"

      - name: Build litigation package
        run: |
          cat \
            docs/policy/CONSTITUTIONAL_OPERATING_DOCTRINE.md \
            docs/legal/AGENCY_OPPOSITION_BRIEF.md \
            docs/legal/REPLY_BRIEF.md > /tmp/litigation-package.md

          pandoc /tmp/litigation-package.md \
            -o dist/pdf/litigation-package.pdf \
            --pdf-engine=xelatex \
            -V geometry:margin=1in \
            -V fontsize=12pt
          cp dist/pdf/litigation-package.pdf "dist/pdf/litigation-package-${{ steps.stamp.outputs.date }}-${{ steps.stamp.outputs.short_sha }}.pdf"

      - name: Mirror dist into docs for GitHub Pages
        run: |
          mkdir -p docs/assets docs/pdf docs/.well-known
          cp dist/index.html docs/index.html
          cp dist/print.css docs/print.css
          cp -R dist/assets/. docs/assets/
          cp -R dist/pdf/. docs/pdf/
          cp -R dist/.well-known/. docs/.well-known/

      - name: Commit generated distribution artifacts
        run: |
          if [[ -n "$(git status --porcelain dist/pdf docs/index.html docs/print.css docs/assets docs/pdf docs/.well-known)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dist/pdf docs/index.html docs/print.css docs/assets docs/pdf docs/.well-known
            git commit -m "dist: rebuild and mirror citable artifacts ${{ steps.stamp.outputs.date }} ${{ steps.stamp.outputs.short_sha }}"
            git push
          else
            echo "No distribution changes to commit."
          fi

      - name: Upload generated PDFs
        uses: actions/upload-artifact@v4
        with:
          name: machine-speed-due-process-pdfs
          path: dist/pdf/*.pdf
