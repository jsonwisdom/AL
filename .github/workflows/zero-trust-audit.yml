name: Zero Trust Audit

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  zero-trust-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Initialize audit surfaces
        run: bash scripts/audit/init_zero_trust_audit.sh

      - name: Replay truth surface
        run: bash scripts/audit/replay_truth_surface.sh

      - name: Consistency check
        run: bash scripts/audit/consistency_check.sh

      - name: Ghost anchor detector
        run: bash scripts/audit/ghost_anchor_detector.sh

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: zero-trust-audit-reports
          path: _truth/audit/
