name: KB Batch - Build & Verify

on:
  push:
    branches: [ master ]
    paths:
      - '_truth/batches/**'
      - 'scripts/build_kb_batch.py'
      - 'scripts/verify_kb_batch.py'
      - '.github/workflows/kb-batch-verify.yml'
  pull_request:
    branches: [ master ]
    paths:
      - '_truth/batches/**'
      - 'scripts/build_kb_batch.py'
      - 'scripts/verify_kb_batch.py'
      - '.github/workflows/kb-batch-verify.yml'
  workflow_dispatch:

jobs:
  verify-batch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild KB batch
        run: |
          python scripts/build_kb_batch.py

      - name: Verify deterministic replay
        run: |
          python scripts/verify_kb_batch.py --fail-on-blocked

      - name: Show final KB batch manifest
        if: always()
        run: |
          cat _truth/batches/kb_batch_001.json | python -m json.tool
