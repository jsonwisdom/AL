name: KB Batch - Build & Verify

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  verify-batch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild KB batch
        run: |
          python scripts/build_kb_batch.py

      - name: Verify deterministic replay
        run: |
          python scripts/verify_kb_batch.py

      - name: Show final KB batch manifest
        run: |
          cat _truth/batches/kb_batch_001.json | python -m json.tool
