name: Witness Replay

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'src/emitter.ts'
      - 'src/verifier.ts'
      - 'schemas/UID_V1.schema.json'
      - 'schemas/WITNESS_V1.schema.json'
      - 'scripts/l2_batcher.py'
      - '.github/workflows/witness-replay.yml'

permissions:
  contents: read

jobs:
  witness-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run witness:build

      - name: Replay run 1
        run: |
          rm -rf .runtime
          npm run witness:emit:gauntlet | tee emit1.log
          WITNESS_FILE=$(find .runtime/witnesses -name 'uid:*.json' | sort | head -n 1)
          npm run witness:verify -- "$WITNESS_FILE" | tee verify1.log
          sha256sum "$WITNESS_FILE" | tee witness1.sha256
          basename "$WITNESS_FILE" .json | tee witness1.uid

      - name: Replay run 2
        run: |
          rm -rf .runtime
          npm run witness:emit:gauntlet | tee emit2.log
          WITNESS_FILE=$(find .runtime/witnesses -name 'uid:*.json' | sort | head -n 1)
          npm run witness:verify -- "$WITNESS_FILE" | tee verify2.log
          sha256sum "$WITNESS_FILE" | tee witness2.sha256
          basename "$WITNESS_FILE" .json | tee witness2.uid

      - name: Replay run 3
        run: |
          rm -rf .runtime
          npm run witness:emit:gauntlet | tee emit3.log
          WITNESS_FILE=$(find .runtime/witnesses -name 'uid:*.json' | sort | head -n 1)
          npm run witness:verify -- "$WITNESS_FILE" | tee verify3.log
          sha256sum "$WITNESS_FILE" | tee witness3.sha256
          basename "$WITNESS_FILE" .json | tee witness3.uid

      - name: Print replay evidence
        if: always()
        run: |
          echo "=== witness UIDs ==="
          cat witness1.uid || true
          cat witness2.uid || true
          cat witness3.uid || true
          echo "=== witness SHA256 ==="
          cat witness1.sha256 || true
          cat witness2.sha256 || true
          cat witness3.sha256 || true

      - name: Compare replay outputs
        id: compare
        run: |
          awk '{print $1}' witness1.sha256 | tr -d '\n\r ' > witness1.hash
          awk '{print $1}' witness2.sha256 | tr -d '\n\r ' > witness2.hash
          awk '{print $1}' witness3.sha256 | tr -d '\n\r ' > witness3.hash
          tr -d '\n\r ' < witness1.uid > witness1.uid.norm
          tr -d '\n\r ' < witness2.uid > witness2.uid.norm
          tr -d '\n\r ' < witness3.uid > witness3.uid.norm
          cmp witness1.hash witness2.hash
          cmp witness2.hash witness3.hash
          cmp witness1.uid.norm witness2.uid.norm
          cmp witness2.uid.norm witness3.uid.norm
          grep -q '^REPLAY_OK uid:' verify1.log
          grep -q '^REPLAY_OK uid:' verify2.log
          grep -q '^REPLAY_OK uid:' verify3.log
          echo "3_CLEAN_REPLAYS=PROVEN"

      - name: L2 Batch Creation
        if: ${{ steps.compare.outcome == 'success' }}
        run: |
          python3 scripts/l2_batcher.py create
          python3 scripts/l2_batcher.py verify
          python3 scripts/l2_batcher.py eas
          echo "L2_BATCH_REPLAY=PROVEN"

      - name: Print L2 batch evidence
        if: always()
        run: |
          echo "=== L2 batch manifest ==="
          cat _truth/batches/batch_manifest.json || true
          echo "=== L2 replay report ==="
          cat _truth/batches/replay_report.json || true
          echo "=== L2 EAS payload draft ==="
          cat _truth/batches/eas_payload.draft.json || true

      - name: Upload replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: witness-replay-artifacts
          path: |
            emit*.log
            verify*.log
            witness*.sha256
            witness*.uid
            .runtime/witnesses/*.json

      - name: Upload L2 batch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-batch-artifacts
          path: |
            _truth/batches/batch_manifest.json
            _truth/batches/replay_report.json
            _truth/batches/eas_payload.draft.json
