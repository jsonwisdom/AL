name: SBOM Generation (CycloneDX)

on:
  push:
    branches: [ "master" ]
    paths:
      - 'package-lock.json'
      - 'yarn.lock'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/sbom-cyclonedx.yml'
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install CycloneDX npm generator
        run: |
          npm install -g @cyclonedx/cyclonedx-npm

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          mkdir -p _truth/security
          if [ -f package.json ]; then
            echo "Generating CycloneDX SBOM from package.json"
            cyclonedx-npm --output-format json --output-file _truth/security/sbom.cdx.json --ignore-npm-errors || {
              echo "cyclonedx-npm failed; generating minimal fallback SBOM"
              printf '%s\n' \
                '{' \
                '  "bomFormat": "CycloneDX",' \
                '  "specVersion": "1.5",' \
                '  "version": 1,' \
                '  "metadata": {' \
                '    "component": {' \
                '      "type": "application",' \
                '      "name": "jsonwisdom/AL"' \
                '    }' \
                '  },' \
                '  "components": []' \
                '}' > _truth/security/sbom.cdx.json
            }
          else
            echo "No package.json found; generating minimal fallback SBOM"
            printf '%s\n' \
              '{' \
              '  "bomFormat": "CycloneDX",' \
              '  "specVersion": "1.5",' \
              '  "version": 1,' \
              '  "metadata": {' \
              '    "component": {' \
              '      "type": "application",' \
              '      "name": "jsonwisdom/AL"' \
              '    }' \
              '  },' \
              '  "components": []' \
              '}' > _truth/security/sbom.cdx.json
          fi

      - name: Generate SPDX companion format
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cdx_path = Path('_truth/security/sbom.cdx.json')
          spdx_path = Path('_truth/security/sbom.spdx.json')
          cdx = json.loads(cdx_path.read_text())
          component = cdx.get('metadata', {}).get('component', {})
          name = component.get('name', 'jsonwisdom/AL')
          spdx = {
              'spdxVersion': 'SPDX-2.3',
              'dataLicense': 'CC0-1.0',
              'SPDXID': 'SPDXRef-DOCUMENT',
              'name': f'{name} SBOM',
              'documentNamespace': 'https://github.com/jsonwisdom/AL/sbom/spdx',
              'creationInfo': {
                  'created': '2026-05-12T00:00:00Z',
                  'creators': ['Tool: AL-SBOM-Workflow']
              },
              'packages': []
          }
          for i, comp in enumerate(cdx.get('components', []), start=1):
              pkg_name = comp.get('name', f'component-{i}')
              pkg_version = comp.get('version', 'NOASSERTION')
              license_declared = 'NOASSERTION'
              licenses = comp.get('licenses') or []
              if licenses:
                  first = licenses[0]
                  if isinstance(first, dict):
                      lic = first.get('license') or {}
                      license_declared = lic.get('id') or lic.get('name') or 'NOASSERTION'
              spdx['packages'].append({
                  'name': pkg_name,
                  'SPDXID': f'SPDXRef-Package-{i}',
                  'downloadLocation': 'NOASSERTION',
                  'filesAnalyzed': False,
                  'versionInfo': pkg_version,
                  'licenseConcluded': 'NOASSERTION',
                  'licenseDeclared': license_declared,
                  'copyrightText': 'NOASSERTION'
              })
          spdx_path.write_text(json.dumps(spdx, indent=2, sort_keys=True) + '\n')
          PY

      - name: Generate SHA256 anchors
        run: |
          cd _truth/security
          sha256sum sbom.cdx.json > sbom.cdx.sha256
          sha256sum sbom.spdx.json > sbom.spdx.sha256

      - name: Commit SBOM artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📦 [automated] SBOM update - CycloneDX + SPDX"
          branch: master
          file_pattern: '_truth/security/*'
          commit_user_name: 'jsonwisdom-audit[bot]'
          commit_user_email: 'audit@jsonwisdom.eth'

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: _truth/security/
