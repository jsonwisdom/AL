name: MN Data Broker CI-FIRST HOLD (draft only)

on:
  push:
    branches:
      - ci-first-mn-87county-registry-hold-20261123
    paths:
      - '_truth/mn_data_broker/2026-11-23/**'
      - '.github/workflows/mn-data-broker-ci-hold.yml'

permissions:
  contents: read

concurrency:
  group: mn-data-broker-draft
  cancel-in-progress: false

jobs:
  read-only-ci:
    if: github.ref == 'refs/heads/ci-first-mn-87county-registry-hold-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: _truth/mn_data_broker/2026-11-23
    steps:
      - name: Checkout pinned commit without retaining credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify hashes, HOLD gates, 17 tests, 280 fuzz cases
        shell: bash
        run: |
          set -euo pipefail
          python3 ci_first_runner.py

      - name: Preserve logs, case digests and SHA-256 manifests (best effort)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mn-data-broker-ci-first-hold
          path: _truth/mn_data_broker/2026-11-23/ci_artifacts/
          retention-days: 30
          if-no-files-found: warn
