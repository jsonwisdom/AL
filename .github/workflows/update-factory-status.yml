name: Factory Console Status Evidence (Read Only)
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'site/factory-console/**'
      - '.github/workflows/update-factory-status.yml'
permissions:
  contents: read
concurrency:
  group: factory-console-status-${{ github.ref }}
  cancel-in-progress: true
jobs:
  factory-status-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Write evidence-only HOLD report
        env:
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p artifacts/factory-console
          jq -n --arg sha "$COMMIT_SHA" --arg event "$EVENT_NAME" --arg run "$RUN_ID" \\
            '{schema:"CW_FACTORY_STATUS_EVIDENCE_V1",commit_sha:$sha,event:$event,run_id:$run,CI_STATE:"HOLD_UNVERIFIED",REMOTE_STATE:"HOLD_UNVERIFIED",GENERATOR_STATE:"HOLD_UNVERIFIED",NO_FAKE_GREEN:"SATISFIED_BY_HOLD",reason:"No independent verification inputs supplied"}' > artifacts/factory-console/status-evidence.json
          sha256sum artifacts/factory-console/status-evidence.json > artifacts/factory-console/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: factory-console-status-evidence
          path: artifacts/factory-console/
          if-no-files-found: error
          retention-days: 30
