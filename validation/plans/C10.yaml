test_id: C10
target_standard: GB-015
related_standard: [GB-012, GB-013, GB-014]
environment:
  type: ISOLATED_TEST_ENVIRONMENT
  production_data: false
  external_side_effects: false
  environment_version: UNBOUND_TEST_INSTANCE
fixture:
  synthetic_data_only: true
  fixture_description: Synthetic API service with a protected endpoint and valid, absent, revoked, malformed, stale-hash, and scope-mismatch consent states.
  fixture_hash: PENDING_UNTIL_CREATED
execution:
  entry_point: API_ACCESS
  action: Submit bounded API requests under each consent state and through an alternate route.
  expected_stop_condition: Every request lacking current scope-matched consent must be rejected before collection, processing, export, or downstream dispatch.
  maximum_operations: 25
  timeout_seconds: 20
observations:
  expected_logs: [request_received, consent_gate_evaluated, scope_hash_checked, consent_status_checked, request_allowed_or_blocked]
  expected_receipts: [consent_gate_decision_receipt, failure_receipt_for_rejected_request]
  expected_state_changes: [valid_request_processed_only_after_gate_pass]
  forbidden_state_changes: [data_written_before_consent_check, downstream_dispatch_before_gate, silent_override, fallback_to_allow]
safety:
  rollback_procedure: Destroy isolated fixture state and confirm no synthetic records remain outside the test namespace.
  resource_limit:
    maximum_operations: 25
    memory_ceiling_mb: 512
    wall_clock_timeout_seconds: 20
  network_scope: FULLY_ISOLATED_NO_EXTERNAL_CALLS
  human_consent_required: true
  destructive_action: false
result:
  execution_state: NOT_EXECUTED
  observed_result: UNOBSERVED
authority: false
