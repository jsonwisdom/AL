    name: "Society of Professional Journalists Placeholder"
    category: "journalism_ethics_org"
    credential_scope:
      - "journalist_identity"
      - "newsroom_affiliation"
    issuer_url: "https://www.spj.org/"
    did_or_jwks_ref: "PENDING_OPERATOR_VERIFICATION"
    revocation_endpoint: "PENDING_OPERATOR_VERIFICATION"
    added_by_pr: "PENDING_INITIAL_GOVERNANCE_PR"
    rationale: "Seed placeholder for journalism credential issuer evaluation; not operational until DID/JWKS and revocation endpoint are verified."
    operational_state: "NOT_OPERATIONAL"

  - issuer_id: "seed-ire-placeholder"
    name: "Investigative Reporters and Editors Placeholder"
