# Trusted Issuers v0.1
# Status: DESIGN_CONFIG_NOT_OPERATIONAL
#
# This file governs issuer roots for RAP request credentials.
# It is a constitutional access surface, not a convenience allowlist.
# Any change must pass tests/membrane/test_trusted_issuers.py.

version: "0.1"
status: "DESIGN_CONFIG_NOT_OPERATIONAL"
policy:
  operator_signature_required: true
  no_ghost_anchor: true
  config_changes_require_pr: true
  revocation_endpoint_required: true
  added_by_pr_required: true
  rationale_required: true
  forbidden_semantics:
    - guilt
    - intent
    - motive
    - corruption
    - threat
    - risk_score
    - bad_actor
    - law_enforcement
    - police
    - prosecution
    - intelligence
    - surveillance

trusted_issuers:
