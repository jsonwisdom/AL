<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CPV Dashboard</title>
  <style>
    body{font-family:system-ui;background:#0b0f14;color:#e6edf3;padding:16px}
    .card{background:#111827;border-radius:12px;padding:16px;margin-bottom:12px}
    .k{opacity:.7} .v{font-weight:700;font-size:20px}
    .row{display:flex;justify-content:space-between;margin:6px 0}
    .hash{font-family:monospace;font-size:12px;word-break:break-all}
  </style>
</head>
<body>
  <div class="card">
    <div class="v">Jay Math CPV</div>
    <div class="k">Compounding Public Value</div>
  </div>

  <div id="cpv" class="card">Loading…</div>

<script>
async function load(){
  const res = await fetch('cpv-feed.json?ts=' + Date.now());
  const data = await res.json();

  const p = data.cpv_receipt.payload;
  const h = data.cpv_receipt.hash;

  document.getElementById('cpv').innerHTML = `
    <div class="row"><div class="k">CPV Index</div><div class="v">${p.cpv_index}</div></div>
    <div class="row"><div class="k">Velocity</div><div>${p.state_velocity}</div></div>
    <div class="row"><div class="k">Verified $</div><div>$${p.verified_math_usd.toLocaleString()}</div></div>
    <div class="row"><div class="k">Multiplier</div><div>${p.human_multiplier}</div></div>
    <div class="row"><div class="k">Window</div><div>${p.time_window}</div></div>
    <div class="row"><div class="k">Computed</div><div>${p.computed_at}</div></div>
    <div class="k">Hash</div>
    <div class="hash">${h}</div>
  `;
}
load();
</script>
</body>
</html>
