<!DOCTYPE html>
<html>
<body style="background:black;color:#00ff88;font-family:monospace">

<h2>ALMS STATUS</h2>
<pre id="out">Loading...</pre>

<script>
async function load(){
  const r = await fetch('../status.json');
  const d = await r.json();

  let consensus = d.consensus ? "TRUE" : "SPLIT";
  let color = d.consensus ? "#00ff88" : "#ff0044";

  document.getElementById("out").innerHTML =
    "STATUS: " + d.status + "\n" +
    "LAST RUN: " + d.last_run + "\n" +
    "ROOT: " + d.root_sha256 + "\n" +
    "MERKLE ROOT: " + d.merkle_root + "\n" +
    "LEAF COUNT: " + d.leaf_count + "\n\n" +
    "CONSENSUS: <span style='color:" + color + ";font-weight:bold'>" + consensus + "</span>";
}

load();
</script>
</body>
</html>
