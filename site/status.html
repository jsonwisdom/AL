<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ALMS STATUS</title>
<style>
body {
  background: black;
  color: #00ff88;
  font-family: monospace;
  padding: 20px;
}
.live { color: #00ff88; }
.stale { color: #ff3b3b; }
.pulse {
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.4; }
  100% { opacity: 1; }
}
.block { margin-top: 15px; }
.hash { color: #6ecbff; }
a { color: #00ff88; }
</style>
</head>
<body>

<h1>⚙️ ALMS STATUS</h1>

<div id="state" class="pulse">LOADING...</div>

<div class="block">Last Run: <span id="last"></span></div>
<div class="block">Age (min): <span id="age"></span></div>
<div class="block">Root: <span id="root" class="hash"></span></div>
<div class="block">Commit: <span id="commit"></span></div>
<div class="block">Runner: <span id="runner"></span></div>

<div class="block">Root Check: <span id="rootcheck"></span><br>Browser Check: <span id="browsercheck"></span></div>

<div class="block">
Links:
<br><a href="../status.json">status.json</a>
<br><a href="../site/alms.html">ALMS Explorer</a>
</div>

<script>
async function load() {
  try {
    const res = await fetch('../status.json');
    const j = await res.json();

    const last = new Date(j.last_run);
    const now = new Date();
    const age = Math.floor((now - last) / 60000);

    document.getElementById('last').textContent = j.last_run;
    document.getElementById('age').textContent = age;
    document.getElementById('root').textContent = j.root_sha256.slice(0,16) + '...';
    document.getElementById('commit').textContent = j.commit.slice(0,12);
    document.getElementById('runner').textContent = j.runner;

    const state = document.getElementById('state');

    if (age > 10) {
      state.textContent = 'STALE';
      state.className = 'stale pulse';
    } else {
      state.textContent = 'LIVE';
      state.className = 'live pulse';
    }

  } catch (e) {
    document.getElementById('state').textContent = 'ERROR';
  }
}

load();
setInterval(load, 30000);

async function verifyRoot(){
 try{
  const s = await fetch("../status.json").then(r=>r.json());
  const r = await fetch("../alms_root.json").then(r=>r.json());

  const el = document.getElementById("rootcheck");

  if(s.root_sha256 === r.root_sha256){
    el.textContent = "PASS";
    el.className = "live pulse";
  } else {
    el.textContent = "MISMATCH";
    el.className = "stale pulse";
  }

 } catch {
  const el = document.getElementById("rootcheck");
  el.textContent = "ERROR";
 }
}

verifyRoot();

async function sha256hex(buf){
 const hash = await crypto.subtle.digest("SHA-256", buf);
 return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function verifyBrowserRoot(){
 try{
  const s = await fetch("../status.json").then(r=>r.json());
  const txt = await fetch("../root_input.json").then(r=>r.text());

  const enc = new TextEncoder().encode(txt);
  const h = await sha256hex(enc);

  const el = document.getElementById("browsercheck");

  if(h === s.root_sha256){
    el.textContent = "PASS";
    el.className = "live pulse";
  } else {
    el.textContent = "MISMATCH";
    el.className = "stale pulse";
  }

 } catch {
  document.getElementById("browsercheck").textContent = "ERROR";
 }
}

verifyBrowserRoot();
</script>

</body>
</html>
