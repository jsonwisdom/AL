<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MN Tri-State Audit</title>
<style>
body{background:#000;color:#0f0;font-family:monospace}
.red{color:#ff3b3b}.yellow{color:#ffd60a}.green{color:#00ff99}
.box{border:1px solid #0f0;padding:10px;margin:10px}
</style>
</head>
<body>
<h1>MN TRI-STATE AUDIT</h1>
<div id="global"></div>
<div id="systems"></div>
<script>
fetch('mn-scoreboard.json').then(r=>r.json()).then(data=>{
document.getElementById('global').innerHTML=`<div class=box>GLOBAL: <span class=${data.global_status.toLowerCase()}>${data.global_status}</span><br>${data.global_reason}</div>`;
let out='';
for(let k in data.systems){let s=data.systems[k];out+=`<div class=box><h2>${s.label} - <span class=${s.status.toLowerCase()}>${s.status}</span></h2><p>${s.plain_english}</p>`;
s.entries.forEach(e=>{out+=`<div><b>${e.title}</b><br>${e.claim}<br><span class=${e.status.toLowerCase()}>${e.status}</span><br>${e.vernacular||''}</div><hr>`});
out+='</div>'}
document.getElementById('systems').innerHTML=out;});
</script>
</body>
</html>
