<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ALMS LIVE</title>
<style>
body { background:#050505; color:#00ff88; font-family:monospace; padding:40px; }
.box { border:1px solid #00ff88; padding:20px; margin-bottom:20px; }
</style>
</head>
<body>

<h1>ALMS LIVE ⚙️</h1>

<div class="box">
<pre id="data">Loading...</pre>
</div>

<script>
fetch('live.json')
  .then(r=>r.json())
  .then(d=>{
    document.getElementById('data').textContent = JSON.stringify(d,null,2);
  });
</script>

</body>
</html>
