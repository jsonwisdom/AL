<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ALMS Verified Anchor</title>
<style>
body{font-family:monospace;background:#0b0b0b;color:#00ff88;padding:20px}
.card{border:1px solid #00ff88;padding:15px;margin-bottom:15px}
.mono{word-break:break-all}
.status{color:#9cff9c;font-weight:bold}
button{background:#0b0b0b;color:#00ff88;border:1px solid #00ff88;padding:8px 12px;cursor:pointer}
button:hover{background:#00331f}
a{color:#00ff88}
</style>
</head>
<body>
<h1>ALMS — Verified Anchor</h1>
<div id="app">loading...</div>
<script>
async function sha256Hex(text){
  const b=new TextEncoder().encode(text);
  const h=await crypto.subtle.digest('SHA-256',b);
  return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function stable(v){
  if(v===null||typeof v!=='object') return JSON.stringify(v);
  if(Array.isArray(v)) return '['+v.map(stable).join(',')+']';
  return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';
}
const anchor={
  cid:'bafkreidd5zm6gwqkwscg2jck34bakqe6tct237pftvqbv4njjxonh4ieme',
  root:'cad549f24bec742fd1f6bd280e3202921fa2dd6a11f82eb36ff9ecd990303546',
  leaf_count:3,
  url:'https://gateway.pinata.cloud/ipfs/bafkreidd5zm6gwqkwscg2jck34bakqe6tct237pftvqbv4njjxonh4ieme'
};
async function verify(){
  const el=document.getElementById('result');
  el.textContent='verifying...';
  try{
    const j=await fetch(anchor.url,{cache:'no-store'}).then(r=>r.json());
    const okRoot=j.merkle_root_sha256===anchor.root;
    const okCount=Number(j.leaf_count)===Number(anchor.leaf_count);
    const hash=await sha256Hex(stable(j));
    el.innerHTML=`status: ${okRoot&&okCount?'<span class="status">PASS</span>':'FAIL'}<br>root_match: ${okRoot}<br>count_match: ${okCount}<br>sha256:<br><span class="mono">${hash}</span>`;
  }catch(e){el.textContent='error: '+e.message;}
}
document.getElementById('app').innerHTML=`
<div class="card">
<b>IPFS CID</b><br><span class="mono">${anchor.cid}</span><br><br>
<b>Merkle Root</b><br><span class="mono">${anchor.root}</span><br><br>
<b>Leaf Count</b><br>${anchor.leaf_count}<br><br>
<button onclick="verify()">Verify Anchor</button>
<div id="result">not run</div><br>
<a href="${anchor.url}" target="_blank" rel="noopener noreferrer">Open IPFS Anchor</a>
</div>`;
</script>
</body>
</html>
