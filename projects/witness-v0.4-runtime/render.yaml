services:
  - type: web
    name: witness-court-pilot
    runtime: python
    plan: free
    branch: project/witness-v0.4-runtime
    rootDir: projects/witness-v0.4-runtime
    buildCommand: pip install -r requirements.txt
    startCommand: mkdir -p /tmp/witness-data && uvicorn witness_court_pilot_v4:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATA_DIR
        value: /tmp/witness-data
