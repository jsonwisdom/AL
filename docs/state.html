<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>State</title><style>body{font-family:system-ui;max-width:980px;margin:42px auto;padding:0 20px}pre{background:#f6f6f6;padding:14px;border-radius:10px;white-space:pre-wrap}</style></head><body><p><a href="./">Home</a></p><h1>State</h1><pre id="state">Loading latest.json…</pre><script>(async()=>{try{const r=await fetch('https://api.github.com/repos/jsonwisdom/AL/contents/_truth/meta/public_exports/latest.json?ref=main',{headers:{Accept:'application/vnd.github+json'}});const m=await r.json();const raw=await fetch(m.download_url).then(x=>x.text());document.getElementById('state').textContent=raw}catch(e){document.getElementById('state').textContent='Error loading latest.json'}})()</script></body></html>
