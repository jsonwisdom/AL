<!-- docs/proof/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL Receipt Viewer — Attestation Ledger</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            background: #0a0e12;
            color: #e4e4e7;
            padding: 2rem;
            line-height: 1.5;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { font-size: 2rem; font-weight: 600; margin-bottom: 0.5rem; }
        .subhead { color: #71717a; margin-bottom: 2rem; border-left: 3px solid #3b82f6; padding-left: 1rem; }
        .status {
            background: #18181b;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 2rem;
            font-size: 0.875rem;
            font-family: monospace;
            border: 1px solid #27272a;
        }
        .receipt-grid { display: flex; flex-direction: column; gap: 1rem; }
        .receipt-card {
            background: #121317;
            border: 1px solid #27272a;
            border-radius: 0.75rem;
            padding: 1.25rem;
            transition: all 0.2s;
        }
        .receipt-card:hover { border-color: #3b82f6; background: #18181b; }
        .receipt-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .claim {
            font-family: monospace;
            font-weight: 600;
            color: #3b82f6;
            word-break: break-all;
        }
        .timestamp { color: #71717a; font-size: 0.75rem; font-family: monospace; }
        .details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 0.75rem;
            margin-top: 0.75rem;
            font-size: 0.8125rem;
        }
        .detail-item {
            background: #0a0e12;
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem;
            border-left: 2px solid #3b82f6;
        }
        .detail-label {
            color: #71717a;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }
        .detail-value { font-family: monospace; word-break: break-all; font-size: 0.75rem; }
        .algorithm-badge {
            background: #1e293b;
            color: #94a3b8;
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.7rem;
            font-family: monospace;
        }
        .error { background: #7f1a1a; border: 1px solid #ef4444; padding: 1rem; border-radius: 0.5rem; color: #fecaca; }
        .loading { text-align: center; padding: 3rem; color: #71717a; }
        footer {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid #27272a;
            text-align: center;
            font-size: 0.75rem;
            color: #52525b;
        }
        a { color: #60a5fa; text-decoration: none; }
        a:hover { text-decoration: underline; }
        @media (max-width: 768px) { body { padding: 1rem; } .details { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <h1>📋 AL Receipt Viewer</h1>
    <div class="subhead">Attestation Ledger — verifiable claims from <code>_truth/receipts/index.json</code></div>

    <div id="app">
        <div class="loading">Loading receipts from <code>_truth/receipts/index.json</code>...</div>
    </div>
    <footer>
        <span>🔗 Receipts indexed from <code>_truth/receipts/</code> • A claim is public only when receipt is present, indexed, and replay-linkable</span>
    </footer>
</div>

<script>
    const app = document.getElementById('app');
    const RAW_BASE = 'https://raw.githubusercontent.com/jsonwisdom/AL/master';

    async function loadReceipts() {
        try {
            const indexResponse = await fetch(`${RAW_BASE}/_truth/receipts/index.json`);
            if (!indexResponse.ok) throw new Error(`HTTP ${indexResponse.status}`);
            const indexData = await indexResponse.json();

            const receiptEntries = indexData.index?.receipts || [];

            if (receiptEntries.length === 0) {
                app.innerHTML = '<div class="status">⚠️ No receipts found in index</div>';
                return;
            }

            const receipts = [];
            for (const entry of receiptEntries) {
                try {
                    const receiptPath = entry.path;
                    if (!receiptPath) continue;

                    const receiptResp = await fetch(`${RAW_BASE}/${receiptPath}`);
                    if (!receiptResp.ok) throw new Error(`HTTP ${receiptResp.status}`);
                    const receiptData = await receiptResp.json();

                    receipts.push({
                        ...receiptData,
                        _meta: {
                            path: receiptPath,
                            index_hash: entry.hash || 'unverified',
                            index_timestamp: entry.timestamp,
                            claims_indexed: entry.claims || [],
                            size_bytes: entry.size_bytes
                        }
                    });
                } catch (err) {
                    console.warn(`Could not load receipt ${entry.path}:`, err);
                    receipts.push({
                        error: true,
                        _meta: { path: entry.path, error: err.message }
                    });
                }
            }

            renderReceipts(receipts, indexData);
        } catch (err) {
            console.error(err);
            app.innerHTML = `<div class="error">❌ Failed to load receipt index: ${err.message}<br><br>Make sure <code>_truth/receipts/index.json</code> exists on <code>master</code> and is accessible through raw.githubusercontent.com.</div>`;
        }
    }

    function renderReceipts(receipts, indexData) {
        if (!receipts.length) {
            app.innerHTML = '<div class="status">No receipts loaded</div>';
            return;
        }

        const totalReceipts = indexData.index?.total_receipts || receipts.length;
        const loadedCount = receipts.filter(r => !r.error).length;

        const html = `
            <div class="status">
                📍 Loaded ${loadedCount} of ${totalReceipts} receipts • 
                Schema: ${indexData.schema_version || 'unknown'} • 
                Last updated: ${indexData.last_updated || 'unknown'}
            </div>
            <div class="receipt-grid">
                ${receipts.map(receipt => renderReceiptCard(receipt)).join('')}
            </div>
        `;
        app.innerHTML = html;
    }

    function renderReceiptCard(receipt) {
        if (receipt.error) {
            return `
                <div class="receipt-card" style="border-color:#7f1a1a">
                    <div class="receipt-header">
                        <span class="claim" style="color:#ef4444">⚠️ Failed to load</span>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Path</div>
                        <div class="detail-value">${escapeHtml(receipt._meta?.path || 'unknown')}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Error</div>
                        <div class="detail-value">${escapeHtml(receipt._meta?.error || 'Unknown error')}</div>
                    </div>
                </div>
            `;
        }

        const claim = receipt.claim || (receipt._meta?.claims_indexed?.length ? receipt._meta.claims_indexed.join(', ') : 'No claim field');
        const algorithm = receipt.algorithm || 'unknown';
        const timestamp = receipt.timestamp || receipt._meta?.index_timestamp || 'unknown';
        const commitment = receipt.commitment || 'none';
        const signature = receipt.signature ? truncateHash(receipt.signature) : 'missing';
        const version = receipt.version || '1.0';

        const hasRequiredFields = receipt.claim && receipt.timestamp && receipt.signature;
        const verificationStatus = hasRequiredFields ? '✅ Verified structure' : '⚠️ Incomplete receipt';

        return `
            <div class="receipt-card">
                <div class="receipt-header">
                    <span class="claim">📜 ${escapeHtml(typeof claim === 'string' ? claim : JSON.stringify(claim))}</span>
                    <span class="algorithm-badge">${escapeHtml(algorithm)}</span>
                </div>
                <div class="timestamp">🕐 ${escapeHtml(timestamp)} • ${verificationStatus}</div>
                
                <div class="details">
                    <div class="detail-item">
                        <div class="detail-label">Commitment</div>
                        <div class="detail-value">${escapeHtml(typeof commitment === 'string' ? truncateHash(commitment, 40) : JSON.stringify(commitment))}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Signature (truncated)</div>
                        <div class="detail-value">${escapeHtml(signature)}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Version / Proof</div>
                        <div class="detail-value">v${escapeHtml(version)} • ${receipt.proof ? 'proof present' : 'no proof field'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Index Claims</div>
                        <div class="detail-value">${receipt._meta?.claims_indexed?.map(c => escapeHtml(c)).join(', ') || 'none'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Indexed Hash</div>
                        <div class="detail-value"><code>${escapeHtml(receipt._meta?.index_hash || 'unverified')}</code></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Source Path</div>
                        <div class="detail-value"><code>${escapeHtml(receipt._meta?.path || 'unknown')}</code></div>
                    </div>
                </div>
            </div>
        `;
    }

    function truncateHash(str, len = 24) {
        if (!str || typeof str !== 'string') return str || '—';
        if (str.length <= len) return str;
        return str.slice(0, len) + '…';
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = typeof str === 'string' ? str : JSON.stringify(str);
        return div.innerHTML;
    }

    loadReceipts();
</script>
</body>
</html>
