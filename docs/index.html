<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALMS Chain Explorer</title>
  <style>
    :root {
      --bg: #070b0a;
      --panel: #0d1512;
      --line: #1f3b31;
      --green: #00ff88;
      --muted: #7fb69c;
      --yellow: #ffd166;
      --red: #ff5c7a;
      --blue: #6ecbff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: radial-gradient(circle at top, #11241d, var(--bg) 45%);
      color: var(--green);
      padding: 18px;
    }
    header {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
      border: 1px solid var(--line);
      background: rgba(13,21,18,.9);
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 0 30px rgba(0,255,136,.08);
    }
    h1 { margin: 0; font-size: clamp(24px, 5vw, 44px); letter-spacing: -1px; }
    .subtitle { color: var(--muted); line-height: 1.5; }
    .matrix {
      border:1px solid var(--line);
      padding:14px;
      border-radius:14px;
      margin-bottom:16px;
      background:rgba(13,21,18,.85);
    }
    .matrix h2 { margin:0 0 10px 0; }
    .matrix p { color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
    .card {
      border: 1px solid var(--line);
      background: rgba(13,21,18,.86);
      padding: 14px;
      border-radius: 14px;
      min-height: 92px;
    }
  </style>
</head>
<body>
  <header>
    <h1>ALMS — Public Chain Explorer</h1>
    <div class="subtitle">
      Verification > narrative. Receipts > claims.
    </div>
  </header>

  <section class="matrix">
    <h2>⚙️ Agent Income Matrix</h2>
    <p>Agents pay to verify. Verified results earn routing. Truth becomes a market.</p>
    <div class="grid">
      <div class="card">INPUT → claim</div>
      <div class="card">CALL → extract / verify</div>
      <div class="card">PAY → per call (x402)</div>
      <div class="card">OUTPUT → RESOLVED / DRIFT / FAIL</div>
    </div>
  </section>

  <footer>
    ⚙️ jaywisdom.base.eth
  </footer>
</body>
</html>
