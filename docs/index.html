<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALMS Agent Income Matrix</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --bg:#070b0a; --panel:#0d1512; --line:#1f3b31; --green:#00ff88; --muted:#7fb69c; --yellow:#ffd166; --red:#ff5c7a; --blue:#6ecbff; }
    body { margin:0; font-family:monospace; background:#070b0a; color:#00ff88; padding:18px; }
    .panel { border:1px solid #1f3b31; padding:18px; border-radius:12px; margin-bottom:16px; }
  </style>
</head>
<body>
  <div class="panel">
    <h2>📈 Routing Weight Over Time</h2>
    <canvas id="chart"></canvas>
  </div>

<script>
async function loadChart(){
  try {
    const res = await fetch('routing-history.json');
    const data = await res.json();

    const labels = data.map(d => d.timestamp);
    const weights = data.map(d => d.routing_weight);

    new Chart(document.getElementById('chart'), {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Routing Weight',
          data: weights,
          borderWidth: 2
        }]
      }
    });
  } catch(e){
    console.log('No history yet');
  }
}
loadChart();
</script>
</body>
</html>
